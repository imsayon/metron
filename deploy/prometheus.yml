global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: metron-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: metron-cycle
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: cycle

  - job_name: metron-titiler
    metrics_path: /metrics
    static_configs:
      - targets: ["titiler:8000"]
        labels:
          service: titiler
